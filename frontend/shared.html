<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shared Note — Peblo</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0a0f; --bg2: #111118; --bg3: #18181f;
      --border: rgba(255,255,255,0.06); --border2: rgba(255,255,255,0.12);
      --text: #f0f0f8; --text2: #9090a8; --text3: #5a5a70;
      --accent: #7c6fff; --green: #22d3a0; --green-dim: rgba(34,211,160,0.1);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; min-height: 100vh; }

    .page { max-width: 720px; margin: 0 auto; padding: 60px 40px; }

    .brand {
      display: flex; align-items: center; gap: 8px;
      margin-bottom: 48px;
    }
    .brand-icon {
      width: 28px; height: 28px; background: linear-gradient(135deg, #7c6fff, #a78bfa);
      border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 14px;
    }
    .brand-name { font-family: 'Syne', sans-serif; font-size: 16px; font-weight: 700; }
    .brand-badge {
      font-size: 10px; background: rgba(124,111,255,0.15); color: #7c6fff;
      border: 1px solid rgba(124,111,255,0.3); border-radius: 4px; padding: 1px 6px;
    }
    .public-tag {
      margin-left: auto; font-size: 11px; color: var(--green);
      background: var(--green-dim); border: 1px solid rgba(34,211,160,0.2);
      padding: 4px 10px; border-radius: 20px;
    }

    .note-title { font-family: 'Syne', sans-serif; font-size: 36px; font-weight: 800; letter-spacing: -0.03em; margin-bottom: 16px; line-height: 1.1; }

    .note-meta {
      display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
      margin-bottom: 24px; padding-bottom: 24px; border-bottom: 1px solid var(--border);
    }
    .meta-chip { font-size: 12px; color: var(--text3); display: flex; align-items: center; gap: 4px; }
    .tag { font-size: 11px; padding: 3px 8px; border-radius: 20px; background: rgba(124,111,255,0.1); color: #7c6fff; }

    .note-content { font-size: 16px; line-height: 1.9; color: var(--text2); white-space: pre-wrap; margin-bottom: 40px; }

    .ai-block {
      background: var(--bg2); border: 1px solid var(--border);
      border-radius: 12px; padding: 24px; margin-top: 32px;
    }
    .ai-block-header {
      display: flex; align-items: center; gap: 8px;
      font-family: 'Syne', sans-serif; font-size: 14px; font-weight: 600;
      margin-bottom: 16px;
    }
    .ai-dot { width: 8px; height: 8px; border-radius: 50%; background: #7c6fff; box-shadow: 0 0 6px #7c6fff; }
    .ai-summary { font-size: 14px; color: var(--text2); line-height: 1.8; margin-bottom: 20px; }
    .action-items-title { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text3); margin-bottom: 12px; }
    .action-item { display: flex; align-items: flex-start; gap: 8px; padding: 6px 0; font-size: 13px; color: var(--text2); }
    .check { color: var(--green); }

    .footer { margin-top: 60px; padding-top: 24px; border-top: 1px solid var(--border); font-size: 12px; color: var(--text3); text-align: center; }
    .footer a { color: #7c6fff; text-decoration: none; }
    .footer a:hover { text-decoration: underline; }

    .error-page { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 40px; color: var(--text3); }
    .error-icon { font-size: 56px; margin-bottom: 16px; opacity: 0.4; }
    .error-title { font-family: 'Syne', sans-serif; font-size: 22px; font-weight: 700; color: var(--text2); margin-bottom: 8px; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="config.js"></script>
  <script>
    const API = window.PEBLO_API_URL || (
      location.hostname === 'localhost' || location.hostname === '127.0.0.1'
        ? 'http://localhost:4000'
        : location.origin
    );
    const shareId = new URLSearchParams(window.location.search).get('id')
      || window.location.pathname.split('/shared/')[1];

    function timeAgo(d) {
      const s = Math.floor((Date.now() - new Date(d + (d.includes('Z') ? '' : 'Z')).getTime()) / 1000);
      if (s < 60) return 'just now';
      if (s < 3600) return Math.floor(s/60) + 'm ago';
      if (s < 86400) return Math.floor(s/3600) + 'h ago';
      return Math.floor(s/86400) + 'd ago';
    }

    async function load() {
      if (!shareId) { render404(); return; }
      try {
        const res = await fetch(`${API}/shared/${shareId}`);
        if (!res.ok) { render404(); return; }
        const { note } = await res.json();
        renderNote(note);
      } catch { render404(); }
    }

    function render404() {
      document.getElementById('root').innerHTML = `
        <div class="error-page">
          <div class="error-icon">🔒</div>
          <div class="error-title">Note not found</div>
          <p>This note may have been made private or the link is invalid.</p>
        </div>`;
    }

    function renderNote(note) {
      const tags = (note.tags || []).map(t => `<span class="tag">#${t}</span>`).join('');
      const actions = (note.ai_action_items || []).map(a => `
        <div class="action-item"><span class="check">✓</span> ${a}</div>
      `).join('');

      document.title = `${note.title} — Peblo Notes`;
      document.getElementById('root').innerHTML = `
        <div class="page">
          <div class="brand">
            <div class="brand-icon">📝</div>
            <span class="brand-name">Peblo Notes</span>
            <span class="brand-badge">AI</span>
            <span class="public-tag">Public Note</span>
          </div>
          <h1 class="note-title">${escapeHtml(note.title || 'Untitled')}</h1>
          <div class="note-meta">
            <span class="meta-chip">📁 ${escapeHtml(note.category || 'General')}</span>
            <span class="meta-chip">🕐 ${timeAgo(note.updated_at)}</span>
            ${tags}
          </div>
          <div class="note-content">${escapeHtml(note.content || '')}</div>
          ${note.ai_summary ? `
          <div class="ai-block">
            <div class="ai-block-header"><div class="ai-dot"></div> AI Summary</div>
            <div class="ai-summary">${escapeHtml(note.ai_summary)}</div>
            ${actions.length ? `<div class="action-items-title">Action Items</div>${actions}` : ''}
          </div>` : ''}
          <div class="footer">Shared via <a href="/">Peblo Notes</a> — AI-powered note workspace</div>
        </div>`;
    }

    function escapeHtml(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    load();
  </script>
</body>
</html>
